name: build
on: push

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            CI: true

        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 24

            - uses: bahmutov/npm-install@v1

            - name: check and build
              run: |
                  npm run format:check
                  npm run build
